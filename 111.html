// ===================== 坐标转换：WGS84 → BD09 =====================
var PI = Math.PI;
var X_PI = PI * 3000.0 / 180.0;
var A = 6378245.0;
var EE = 0.00669342162296594323;

function outOfChina(lng, lat) {
    return (lng < 72.004 || lng > 137.8347) || (lat < 0.8293 || lat > 55.8271);
}
function transformLat(lng, lat) {
    var ret = -100.0 + 2.0 * lng + 3.0 * lat + 0.2 * lat * lat + 0.1 * lng * lat + 0.2 * Math.sqrt(Math.abs(lng));
    ret += (20.0 * Math.sin(6.0 * lng * PI) + 20.0 * Math.sin(2.0 * lng * PI)) * 2.0 / 3.0;
    ret += (20.0 * Math.sin(lat * PI) + 40.0 * Math.sin(lat / 3.0 * PI)) * 2.0 / 3.0;
    ret += (160.0 * Math.sin(lat / 12.0 * PI) + 320 * Math.sin(lat * PI / 30.0)) * 2.0 / 3.0;
    return ret;
}
function transformLng(lng, lat) {
    var ret = 300.0 + lng + 2.0 * lat + 0.1 * lng * lng + 0.1 * lng * lat + 0.1 * Math.sqrt(Math.abs(lng));
    ret += (20.0 * Math.sin(6.0 * lng * PI) + 20.0 * Math.sin(2.0 * lng * PI)) * 2.0 / 3.0;
    ret += (20.0 * Math.sin(lng * PI) + 40.0 * Math.sin(lng / 3.0 * PI)) * 2.0 / 3.0;
    ret += (150.0 * Math.sin(lng / 12.0 * PI) + 300.0 * Math.sin(lng / 30.0 * PI)) * 2.0 / 3.0;
    return ret;
}
function wgs84togcj02(lng, lat) {
    if (outOfChina(lng, lat)) return [lng, lat];
    var dlat = transformLat(lng - 105.0, lat - 35.0);
    var dlng = transformLng(lng - 105.0, lat - 35.0);
    var radlat = lat / 180.0 * PI;
    var magic = Math.sin(radlat);
    magic = 1 - EE * magic * magic;
    var sqrtmagic = Math.sqrt(magic);
    dlat = (dlat * 180.0) / ((A * (1 - EE)) / (magic * sqrtmagic) * PI);
    dlng = (dlng * 180.0) / (A / sqrtmagic * Math.cos(radlat) * PI);
    return [lng + dlng, lat + dlat];
}
function gcj02tobd09(lng, lat) {
    var z = Math.sqrt(lng * lng + lat * lat) + 0.00002 * Math.sin(lat * X_PI);
    var theta = Math.atan2(lat, lng) + 0.000003 * Math.cos(lng * X_PI);
    var bd_lng = z * Math.cos(theta) + 0.0065;
    var bd_lat = z * Math.sin(theta) + 0.006;
    return [bd_lng, bd_lat];
}
function wgs84tobd09(lng, lat) {
    var gcj = wgs84togcj02(lng, lat);
    return gcj02tobd09(gcj[0], gcj[1]);
}
function toBdPoint(lng, lat) {
    var bd = wgs84tobd09(lng, lat);
    return new BMapGL.Point(bd[0], bd[1]);
}

// ===================== 全局变量 =====================
var map;
var overlays = {
    ports: [], cities: [], routes: [], currents: [], rivers: [], countries: []
};
var lastPortClickTime = 0;

// ===================== 初始化地图（百度 API 回调） =====================
function initMap() {
    map = new BMapGL.Map('map', {
        minZoom: 3,
        maxZoom: 10,
        enableBizAuthLogo: false
    });
    // 以 BD09 坐标 (0, 20) 附近为中心，zoom 3 显示世界
    map.centerAndZoom(new BMapGL.Point(10, 25), 3);
    map.enableScrollWheelZoom(true);
    map.setMapStyleV2({ styleId: 'midnight' }); // 百度官方深色主题（若无效则用默认）

    // 绘制各图层
    drawRivers();
    drawCurrents();
    drawShippingRoutes();
    drawCities();
    drawPorts();
    loadCountries();

    // 点击地图空白关闭卡片
    map.addEventListener('click', function() {
        if (Date.now() - lastPortClickTime < 300) return;
        closeCard();
    });

    // 缩放控制图层显隐
    map.addEventListener('zoomend', updateLayersByZoom);
    updateLayersByZoom();
}

// ===================== 绘制河流 =====================
function drawRivers() {
    RIVERS.forEach(function(river) {
        var pts = river.points.map(function(p) { return toBdPoint(p[1], p[0]); });
        var polyline = new BMapGL.Polyline(pts, {
            strokeColor: '#5dade2',
            strokeWeight: 1.5,
            strokeOpacity: 0.55
        });
        map.addOverlay(polyline);
        overlays.rivers.push(polyline);
    });
}

// ===================== 绘制洋流 =====================
function drawCurrents() {
    OCEAN_CURRENTS.forEach(function(cur) {
        var pts = cur.points.map(function(p) { return toBdPoint(p[1], p[0]); });
        var color = cur.type === 'warm' ? '#ff4757' : '#2e86de';
        var polyline = new BMapGL.Polyline(pts, {
            strokeColor: color,
            strokeWeight: 2.5,
            strokeOpacity: 0.7,
            strokeStyle: cur.type === 'warm' ? 'solid' : 'dashed'
        });
        map.addOverlay(polyline);
        overlays.currents.push(polyline);
    });
}

// ===================== 绘制海运航线 =====================
function drawShippingRoutes() {
    SHIPPING_ROUTES.forEach(function(route) {
        var pts = route.points.map(function(p) { return toBdPoint(p[1], p[0]); });
        var polyline = new BMapGL.Polyline(pts, {
            strokeColor: '#ffd32a',
            strokeWeight: 2,
            strokeOpacity: 0.65,
            strokeStyle: 'dashed'
        });
        map.addOverlay(polyline);
        overlays.routes.push(polyline);
    });
}

// ===================== 绘制城市 =====================
function drawCities() {
    CITIES.forEach(function(city) {
        var pt = toBdPoint(city.lng, city.lat);
        var label = new BMapGL.Label(
            '<div class="city-label"><span class="city-dot"></span>' + city.name + '</div>',
            { position: pt, offset: new BMapGL.Size(0, -6) }
        );
        label.setStyle({
            background: 'transparent', border: '0', padding: '0',
            color: '#d0e8ff', fontSize: '11px', boxShadow: 'none'
        });
        map.addOverlay(label);
        overlays.cities.push(label);
    });
}

// ===================== 绘制港口 =====================
function drawPorts() {
    PORTS.forEach(function(port) {
        var pt = toBdPoint(port.lng, port.lat);
        var isTop3 = port.rank <= 3;
        var size = isTop3 ? 42 : 34;
        var offsetX = -size / 2;
        var offsetY = -size / 2;

        var label = new BMapGL.Label(
            '<div class="port-marker-inner"><span>' + port.rank + '</span></div>',
            { position: pt, offset: new BMapGL.Size(offsetX, offsetY) }
        );
        label.setStyle({
            background: 'transparent', border: '0', padding: '0',
            boxShadow: 'none', color: '#fff'
        });
        if (isTop3) {
            label.setStyle({ zIndex: 200 });
        }
        // 点击事件
        label.addEventListener('click', function(e) {
            lastPortClickTime = Date.now();
            if (e && e.stopPropagation) e.stopPropagation();
            showPortCard(port);
        });
        map.addOverlay(label);
        overlays.ports.push(label);
    });
}

// ===================== 加载国家轮廓（GeoJSON → BD09） =====================
function loadCountries() {
    fetch('https://cdn.jsdelivr.net/gh/martynafford/natural-earth-geojson/110m/cultural/ne_110m_admin_0_countries.json')
        .then(function(res) { return res.json(); })
        .then(function(data) {
            var features = data.features;
            features.forEach(function(feature) {
                var geometry = feature.geometry;
                if (!geometry) return;
                if (geometry.type === 'Polygon') {
                    drawCountryPolygon(geometry.coordinates);
                } else if (geometry.type === 'MultiPolygon') {
                    geometry.coordinates.forEach(function(polyCoords) {
                        drawCountryPolygon(polyCoords);
                    });
                }
            });
        })
        .catch(function() {
            console.log('国家轮廓 GeoJSON 加载失败');
        });
}

function drawCountryPolygon(rings) {
    // 外环 rings[0]，内环 rings[1..]（暂不处理内环挖空，只画外环轮廓）
    var outerRing = rings[0];
    if (!outerRing || outerRing.length < 3) return;
    var pts = outerRing.map(function(coord) {
        return toBdPoint(coord[0], coord[1]);
    });
    var polygon = new BMapGL.Polygon(pts, {
        strokeColor: 'rgba(100, 160, 220, 0.55)',
        strokeWeight: 0.8,
        strokeOpacity: 0.6,
        fillColor: 'rgba(20, 50, 90, 0.35)',
        fillOpacity: 0.35
    });
    map.addOverlay(polygon);
    overlays.countries.push(polygon);
}

// ===================== 缩放控制图层显隐 =====================
function updateLayersByZoom() {
    var zoom = map.getZoom();
    var hint = document.getElementById('zoom-hint');

    // 河流、洋流、国家：始终显示
    overlays.rivers.forEach(function(o) { o.show(); });
    overlays.currents.forEach(function(o) { o.show(); });
    overlays.countries.forEach(function(o) { o.show(); });

    // 航线：zoom >= 4
    if (zoom >= 4) {
        overlays.routes.forEach(function(o) { o.show(); });
    } else {
        overlays.routes.forEach(function(o) { o.hide(); });
    }

    // 港口：zoom >= 5
    if (zoom >= 5) {
        overlays.ports.forEach(function(o) { o.show(); });
        hint.classList.add('hidden');
    } else {
        overlays.ports.forEach(function(o) { o.hide(); });
        hint.classList.remove('hidden');
    }

    // 城市：zoom >= 6
    if (zoom >= 6) {
        overlays.cities.forEach(function(o) { o.show(); });
    } else {
        overlays.cities.forEach(function(o) { o.hide(); });
    }
}

// ===================== 知识卡片 =====================
function showPortCard(port) {
    document.getElementById('card-rank').textContent = 'NO.' + port.rank;
    document.getElementById('card-name').textContent = port.name;
    document.getElementById('card-country').textContent = port.flag + ' ' + port.country;
    document.getElementById('card-throughput').textContent = port.throughput;
    var growthEl = document.getElementById('card-growth');
    growthEl.textContent = '+' + port.growth + '%';
    growthEl.className = 'stat-value ' + port.growthClass;

    var groupsEl = document.getElementById('card-groups');
    groupsEl.innerHTML = port.groups.map(function(g) { return '<span>' + g + '</span>'; }).join('');

    var knowledgeEl = document.getElementById('card-knowledge');
    knowledgeEl.innerHTML = port.knowledge.map(function(k) { return '<li>' + k + '</li>'; }).join('');

    var card = document.getElementById('info-card');
    card.classList.add('show');
    card.scrollTop = 0;
}

function closeCard() {
    document.getElementById('info-card').classList.remove('show');
}

console.log('✅ 百度地图版十大港口交互地图脚本已加载');
</script>
